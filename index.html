<style>
:root{--bg:#070912;--panel:#111626;--panel2:#17152b;--copper:#55c8ff;--soft:#d8eaff;--muted:#9aaac4;--line:#293b61;--white:#edf4ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#111a30 0,#070912 42%);color:var(--white);font-family:Arial,sans-serif;min-height:100vh}
header{padding:22px 16px 14px;text-align:center;border-bottom:1px solid #263b60}
.mark{width:54px;height:54px;margin:0 auto 9px;border:2px solid var(--copper);border-radius:16px;display:grid;place-items:center;color:var(--soft);font-size:25px;font-weight:900;transform:rotate(45deg)}
.mark span{transform:rotate(-45deg)}.logo{font-size:30px;font-weight:900;letter-spacing:6px;color:var(--copper)}.sub{font-size:10px;letter-spacing:4px;color:var(--muted);margin-top:5px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}.top strong{font-size:14px}
main{padding:0 14px 28px;max-width:850px;margin:auto}h2{font-size:19px;color:var(--copper);margin:10px 0 14px}h3{font-size:16px;color:var(--soft);margin:4px 0 10px}
.panel,.tile{background:linear-gradient(145deg,#111a30,#121315);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px}
.panel p,.muted{color:var(--muted);font-size:13px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:105px;text-align:center;cursor:pointer;color:var(--white);font-size:14px;font-weight:bold}.tile:active,button:active{transform:scale(.98)}.tile .ico{display:block;color:var(--copper);font-size:25px;margin-bottom:10px}
button,.btn{background:#151d35;border:1px solid #426b9c;color:var(--soft);border-radius:11px;padding:11px 14px;font-weight:bold;cursor:pointer;font-size:13px}
button.secondary{background:#111214;border-color:#34496d;color:var(--white)}button.danger{border-color:#8c4545;color:#ffb5a9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
input,textarea,select{width:100%;padding:12px;background:#0d0e10;border:1px solid #34496d;border-radius:10px;color:var(--white);margin:5px 0 10px;font:inherit}
input[type=checkbox]{width:auto;vertical-align:middle;margin-inline-end:7px}textarea{min-height:90px;resize:vertical}label{font-size:13px;color:var(--muted)}.hidden{display:none!important}
.back{margin:4px 0 15px}.itemline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #30271e}.itemline:last-child{border:0}
@font-face{
 font-family:"Amiri Quran";
 src:url("./fonts/amiri-quran.woff2") format("woff2");
 font-weight:normal;
 font-style:normal;
 font-display:swap;
}
.ayahs{font-family:"Amiri Quran",serif;font-size:22px;line-height:2.2;text-align:center;color:var(--soft)}.status{color:var(--copper);font-size:13px;margin-top:10px}
.big{font-size:25px;color:var(--copper);font-weight:bold}.answer{display:block;width:100%;text-align:right;margin:7px 0}
footer{text-align:center;color:#75634e;padding:18px;font-size:11px}
.tile{position:relative;overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s}
.tile:hover{transform:translateY(-3px);border-color:#e2a65a;box-shadow:0 8px 28px #d8792822}
.tile:before{content:"";position:absolute;inset:-60% auto auto -30%;width:70%;height:180%;transform:rotate(28deg);background:linear-gradient(90deg,transparent,#ffb45b12,transparent);pointer-events:none}

.logo{text-shadow:0 0 20px #df8d3b55}

@keyframes orbPulse{0%,100%{box-shadow:0 0 18px #ed8a3e77,0 0 42px #ed8a3e33}50%{box-shadow:0 0 25px #ffc078aa,0 0 58px #ed8a3e55}}
.chat-log{height: min(48vh,420px);overflow:auto;background:#0b0c0e;border:1px solid #263b60;border-radius:13px;padding:12px;margin:12px 0}

small{color:var(--muted)}.note{background:#101113;padding:12px;border-radius:10px;color:var(--muted);font-size:12px;line-height:1.7}

let nexoraWeatherState=null;
let nexoraScreenStartedAt=document.visibilityState==='visible'?Date.now():0;

function nexoraTodayKey(){
 const d=new Date();
 return 'om_screen_daily_ms_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nexoraScreenElapsed(){
 return (Number(localStorage.getItem(nexoraTodayKey()))||0)+
 (nexoraScreenStartedAt&&document.visibilityState==='visible'?Date.now()-nexoraScreenStartedAt:0);
}
function renderNexoraScreenTime(){
 const el=$('nexoraScreenTimeValue');
 if(!el)return;
 let sec=Math.floor(nexoraScreenElapsed()/1000);
 let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
 el.textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
}
function saveNexoraScreenTime(){
 if(!nexoraScreenStartedAt)return;
 localStorage.setItem(nexoraTodayKey(),String(nexoraScreenElapsed()));
 nexoraScreenStartedAt=0;
 renderNexoraScreenTime();
}
function initNexoraScreenTime(){
 if(window.nexoraScreenTimerReady)return;
 window.nexoraScreenTimerReady=true;
 document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')saveNexoraScreenTime();
  else if(!nexoraScreenStartedAt)nexoraScreenStartedAt=Date.now();
  renderNexoraScreenTime();
 });
 window.addEventListener('pagehide',saveNexoraScreenTime);
 setInterval(renderNexoraScreenTime,1000);
 renderNexoraScreenTime();
}
function renderNexoraWeatherCard(){
 const t=$('nexoraWeatherTemp'),p=$('nexoraWeatherPlace'),s=$('nexoraWeatherStatus');
 if(!t||!p||!s)return;
 if(nexoraWeatherState){
  t.textContent=Math.round(nexoraWeatherState.temp)+'°C';
  p.textContent=nexoraWeatherState.place;
  s.textContent=nexoraWeatherState.desc;
 }
}
function requestNexoraWeather(){
 const status=$('nexoraWeatherStatus');
 if(!navigator.geolocation){
  status.textContent=en?'Location unavailable':'الموقع غير مدعوم';return;
 }
 status.textContent=en?'Requesting permission…':'جارٍ طلب إذن الموقع…';
 navigator.geolocation.getCurrentPosition(async pos=>{
  try{
   const lat=pos.coords.latitude,lon=pos.coords.longitude;
   const [wr,pr]=await Promise.all([
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`),
    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${en?'en':'ar'}`)
   ]);
   if(!wr.ok)throw Error('weather');
   const w=await wr.json();
   let place=en?'Your location':'موقعك الحالي';
   if(pr.ok){
    const d=await pr.json();
    place=d.city||d.locality||d.principalSubdivision||place;
   }
   const codes={0:['سماء صافية','Clear sky'],1:['غائم جزئيًا','Mainly clear'],2:['غائم جزئيًا','Partly cloudy'],3:['غائم','Overcast'],45:['ضباب','Fog'],51:['رذاذ خفيف','Light drizzle'],61:['مطر خفيف','Light rain'],63:['مطر متوسط','Moderate rain'],65:['مطر غزير','Heavy rain'],80:['زخات مطر','Rain showers'],95:['عواصف رعدية','Thunderstorm']};
   const c=codes[w.current.weather_code]||['حالة الطقس الحالية','Current conditions'];
   nexoraWeatherState={temp:w.current.temperature_2m,place,desc:c[en?1:0]};
   renderNexoraWeatherCard();
  }catch(e){
   status.textContent=en?'Weather service unavailable':'تعذر تحميل الطقس، تحقق من الإنترنت';
  }
 },e=>{
  status.textContent=e.code===1?(en?'Location permission denied':'تم رفض إذن الموقع'):(en?'Could not get location':'تعذر تحديد الموقع');
 },{enableHighAccuracy:false,timeout:15000,maximumAge:300000});
}

function nxChatData(key, fallback){
 try{
  const value=JSON.parse(get(key,'null'));
  return value===null?fallback:value;
 }catch{return fallback}
}
function nxChatProfiles(){return nxChatData('nxchat_profiles',{})}
function nxChatMessages(){return nxChatData('nxchat_messages',[])}
function nxChatMoments(){return nxChatData('nxchat_moments',[])}
function nxChatRender(){
 const content=$('content');
 if(content)content.innerHTML=nexoraChat();
}
function nxChatTab(tab){
 set('nxchat_tab',tab);
 set('nxchat_active','');
 nxChatRender();
}
function nxChatSaveProfile(){
 const me=activeLocalAccount();
 if(!me)return;
 const input=$('nxChatUsername');
 const username=(input?input.value:'').trim().toLowerCase();
 if(!/^[a-z0-9_]{3,20}$/.test(username)){
  showToast('اسم المستخدم: 3 إلى 20 حرفًا أو رقمًا أو _');
  return;
 }
 const profiles=nxChatProfiles();
 if(Object.keys(profiles).some(id=>id!==me.id&&profiles[id].username===username)){
  showToast('اسم المستخدم مستخدم بالفعل على هذا الجهاز');
  return;
 }
 profiles[me.id]={username,name:me.name||'مستخدم'};
 set('nxchat_profiles',JSON.stringify(profiles));
 set('nxchat_tab','chats');
 nxChatRender();
}
function nxChatDiscover(){
 const input=$('nxChatSearch');
 set('nxchat_query',input?input.value.trim().toLowerCase():'');
 nxChatRender();
}
function nxChatStart(id){
 set('nxchat_active',id);
 set('nxchat_tab','chats');
 nxChatRender();
}
function nxChatSend(){
 const me=activeLocalAccount();
 const other=get('nxchat_active','');
 const input=$('nxChatMessage');
 const body=(input?input.value:'').trim();
 if(!me||!other||!body)return;
 const messages=nxChatMessages();
 messages.push({id:Date.now().toString(36),from:me.id,to:other,text:body,time:new Date().toISOString()});
 set('nxchat_messages',JSON.stringify(messages));
 nxChatRender();
}
function nxChatPostMoment(){
 const me=activeLocalAccount();
 const input=$('nxChatMomentInput');
 const body=(input?input.value:'').trim();
 if(!me||!body)return;
 const moments=nxChatMoments();
 moments.unshift({user:me.id,text:body,time:new Date().toISOString()});
 set('nxchat_moments',JSON.stringify(moments.slice(0,50)));
 nxChatRender();
}

 }else if(tab==='moments'){

async function sendAI(){let input=$('aiInput'),chat=$('aiChat');if(!input||!input.value.trim())return;let msg=input.value.trim();chat.innerHTML+=`<div class="chat-msg user">${escapeHtml(msg)}</div>`;input.value='';chat.scrollTop=chat.scrollHeight;

function xoWinner(b){
 for(const [a,c,d] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])
  if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];
 return b.every(Boolean)?'D':'';
}
function xoWinningCells(){
 for(const line of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]){
  if(xoBoard[line[0]]&&xoBoard[line[0]]===xoBoard[line[1]]&&xoBoard[line[1]]===xoBoard[line[2]])return line;
 }
 return [];
}
function xoDraw(){
 const board=$('xoBoard');if(!board)return;
 const winning=xoWinningCells();
 board.innerHTML=xoBoard.map((v,i)=>`<button class="xo-cell ${v==='X'?'x':v==='O'?'o':''} ${winning.includes(i)?'winner':''}" aria-label="${en?'Cell ':'الخانة '}${i+1}" onclick="xoPlay(${i})" ${v||xoDone||xoMatchDone?'disabled':''}>${v||'·'}</button>`).join('');
 const w=xoWinner(xoBoard);
 let status=xoDone?(w==='D'?(en?'Draw!':'تعادل!'):(en?'Round winner: ':'فائز الجولة: ')+w):(en?'Turn: ':'الدور: ')+xoTurn;
 if(xoMatchDone)status=(en?'🏆 Match winner: ':'🏆 فائز المباراة: ')+(xoMatchWins.X>xoMatchWins.O?'X':'O');
 $('xoStatus').textContent=status;

}
function xoFinish(){
 if(xoDone)return false;
 const w=xoWinner(xoBoard);if(!w)return false;
 xoDone=true;
 xoScores[w]++;
 if(w!=='D'){
  xoMatchWins[w]++;
  if(xoMatchWins[w]>=Math.ceil(xoSeriesTarget/2))xoMatchDone=true;
 }
 xoSaveStats();
 if(xoMode==='cpu'&&w==='X'){
  addAccountPoints(15,'xo_round_win');
  if(xoMatchDone)addAccountPoints(5,'xo_match_win');
 }
 xoDraw();
 return true;
}
function xoFindTactical(mark){
 for(let i=0;i<9;i++)if(!xoBoard[i]){
  xoBoard[i]=mark;const wins=xoWinner(xoBoard)===mark;xoBoard[i]='';
  if(wins)return i;
 }
 return -1;
}
function xoBestMove(){
 const empty=xoBoard.map((v,i)=>v? -1:i).filter(i=>i>=0);
 if(!empty.length)return -1;
 if(xoDifficulty==='easy')return empty[Math.floor(Math.random()*empty.length)];
 if(xoDifficulty==='medium'){
  let move=xoFindTactical('O');if(move>=0)return move;
  move=xoFindTactical('X');if(move>=0)return move;
  if(!xoBoard[4])return 4;
  const corners=[0,2,6,8].filter(i=>!xoBoard[i]);
  if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
  return empty[Math.floor(Math.random()*empty.length)];
 }
 let best=-Infinity,choice=-1;
 for(const i of empty){
  xoBoard[i]='O';const score=xoMinimax(false);xoBoard[i]='';
  if(score>best){best=score;choice=i;}
 }
 return choice;
}
function xoMinimax(maximize){
 const w=xoWinner(xoBoard);
 if(w==='O')return 10;if(w==='X')return -10;if(w==='D')return 0;
 let best=maximize?-Infinity:Infinity;
 for(let i=0;i<9;i++)if(!xoBoard[i]){
  xoBoard[i]=maximize?'O':'X';
  const score=xoMinimax(!maximize);xoBoard[i]='';
  best=maximize?Math.max(best,score):Math.min(best,score);
 }
 return best;
}
function xoPlay(i){
 if(xoDone||xoMatchDone||xoBoard[i])return;
 if(xoMode==='cpu'&&xoTurn==='O')return;
 xoBoard[i]=xoTurn;
 if(xoFinish())return;
 xoTurn=xoTurn==='X'?'O':'X';
 if(xoMode==='cpu'&&xoTurn==='O'){
  const move=xoBestMove();if(move>=0)xoBoard[move]='O';
  if(!xoFinish())xoTurn='X';
 }
 xoDraw();
}
function xoRestart(){
 if(xoMatchDone){xoMatchWins={X:0,O:0};xoMatchDone=false;}

}

function renderChessGame(){

function chessDraw(){
 if(!chessGame||!$('chessBoard'))return;
 const board=chessGame.board(),files='abcdefgh';
 let html='';
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const sq=files[c]+(8-r),piece=board[r][c],selected=chessSelected===sq;
  const targets=chessSelected?chessGame.moves({square:chessSelected,verbose:true}).filter(m=>m.to===sq):[];
  const light=(r+c)%2===1;
  const squareClass=selected?'selected':targets.length?'target':light?'marble-light':'marble-dark';
  const glyph=piece?chessGlyph[piece.color+piece.type]:'';
  html+=`<button class="marble-square ${squareClass}" onclick="chessTap('${sq}')" aria-label="${sq}" style="color:${piece&&piece.color==='w'?'#fffaf0':'#17130f'}">${glyph}<span class="marble-coordinate">${c===0?8-r:''}${r===7?files[c]:''}</span></button>`;
 }
 $('chessBoard').innerHTML=html;
 const status=chessGame.isCheckmate()?(en?'Checkmate! ':'كش مات! ')+(chessGame.turn()==='w'?(en?'Black wins':'الأسود فاز'):(en?'White wins':'الأبيض فاز')):chessGame.isStalemate()?(en?'Draw by stalemate':'تعادل بالخنق'):chessGame.isDraw()?(en?'Draw':'تعادل'):((chessGame.turn()==='w'?(en?'White':'الأبيض'):(en?'Black':'الأسود'))+(en?' to move':' عليه اللعب')+(chessGame.isCheck()?' · '+(en?'Check':'كش'):''));
 $('chessStatus').textContent=status;
 $('chessMoves').textContent=(en?'Moves: ':'النقلات: ')+chessGame.history().join(' ');
}
function chessTap(sq){
 if(!chessGame||chessGame.isGameOver()||chessPromotion)return;
 const piece=chessGame.get(sq);
 if(chessSelected){
  const options=chessGame.moves({square:chessSelected,verbose:true}).filter(m=>m.to===sq);
  if(options.length){
   if(options.some(m=>m.promotion)){chessPromotion={from:chessSelected,to:sq};chessShowPromotion();return;}
   chessGame.move({from:chessSelected,to:sq});chessSelected=null;chessDraw();return;
  }
 }
 if(piece&&piece.color===chessGame.turn()){chessSelected=sq;chessDraw();}
 else{chessSelected=null;chessDraw();}
}
function chessShowPromotion(){
 const el=$('chessPromotion');if(!el)return;
 const color=chessGame.turn(),pieces=['q','r','b','n'];
 el.innerHTML=pieces.map(p=>`<button onclick="chessPromote('${p}')">${chessGlyph[color+p]} ${({q:'Queen',r:'Rook',b:'Bishop',n:'Knight'})[p]}</button>`).join('');
}
function chessPromote(piece){
 if(!chessPromotion)return;
 chessGame.move({...chessPromotion,promotion:piece});
 chessPromotion=null;chessSelected=null;
 $('chessPromotion').innerHTML='';chessDraw();
}
function chessUndo(){if(!chessGame)return;chessGame.undo();chessPromotion=null;chessSelected=null;if($('chessPromotion'))$('chessPromotion').innerHTML='';chessDraw();}
function chessRestart(){chessGame=new window.ChessEngine.Chess();chessSelected=null;chessPromotion=null;if($('chessPromotion'))$('chessPromotion').innerHTML='';chessDraw();}

function questLoad(){

  const saved=JSON.parse(get('nexoraQuest','null'));
  if(saved&&Array.isArray(saved.unlocked)&&Array.isArray(saved.done)&&Array.isArray(saved.items)){
   questState={
    current:typeof saved.current==='string'?saved.current:'forest',
    unlocked:saved.unlocked,
    done:saved.done,
    items:saved.items,
    xp:Math.max(0,Number(saved.xp)||0),
    finished:!!saved.finished
   };
  }
 }catch(e){}
 if(!questState.unlocked.includes('forest'))questState.unlocked.unshift('forest');
 if(!questState.unlocked.includes(questState.current))questState.current='forest';
}

}

function questDraw(){
 const map=$('questMap'),scene=$('questScene'),inventory=$('questInventory');
 if(!map||!scene||!inventory)return;
 map.innerHTML=questWorld.map(z=>{
  const open=questState.unlocked.includes(z.id);
  return `<button class="quest-zone ${questState.current===z.id?'active':''}" onclick="questOpenZone('${z.id}')" ${open?'':'disabled'}>
   <span class="quest-zone-icon">${open?z.icon:'🔒'}</span>${open?z.name:(en?'Locked area':'منطقة مغلقة')}
   <small>${open?(questState.done.some(id=>id.startsWith(z.id+'_'))?(en?'Explored':'تم استكشافها'):z.subtitle):(en?'Unlock by exploring':'افتحها بالتقدم')}</small>
  </button>`;
 }).join('');
 inventory.innerHTML=questState.items.length?questState.items.map(x=>`<span class="quest-item">✦ ${x}</span>`).join(''):`<span class="quest-muted">${en?'Your bag is empty':'حقيبتك فارغة، ابدأ الاستكشاف'}</span>`;
 $('questXP').textContent=questState.xp+' XP';
 $('questProgress').style.width=Math.min(100,questState.unlocked.length/4*100)+'%';
 if(questState.finished){
  scene.innerHTML=`<div class="quest-hero"><div style="font-size:48px">🏆</div><h2 class="quest-title">${en?'QUEST COMPLETED':'اكتملت المغامرة!'}</h2><p class="quest-muted">${en?'You uncovered the secret of the castle and completed your journey.':'اكتشفت سر القلعة وأتممت الرحلة بنجاح.'}</p><b>${questState.xp} XP ✦</b></div>`;
  return;
 }
 const zone=questWorld.find(z=>z.id===questState.current);
 if(!zone){questState.current='forest';questSave();return questDraw();}
 const actions=zone.actions.map(a=>{
  const done=questState.done.includes(a.id);
  const missing=(a.requires||[]).filter(x=>!questState.items.includes(x));
  return `<button class="quest-action" onclick="questStartAction('${a.id}')" ${done||missing.length?'disabled':''}>
   <b>${done?'✓ ':''}${a.title}</b><small>${done?(en?'Completed':'تم الإنجاز'):missing.length?(en?'Requires: ':'يتطلب: ')+missing.join('، '):a.description}</small>
  </button>`;
 }).join('');
 scene.innerHTML=`<div class="quest-scene">
  <div class="quest-kicker">${zone.subtitle}</div>
  <h3>${zone.icon} ${zone.name}</h3>
  <p class="quest-muted">${zone.description}</p>
  ${questNotice?`<p class="quest-note">${questNotice}</p>`:''}
  ${actions}
  <div id="questPuzzle"></div>
 </div>`;
 if(questActivePuzzle)questShowPuzzle();
}
function questOpenZone(id){
 if(!questState.unlocked.includes(id))return;
 questState.current=id;questActivePuzzle='';questNotice='';questSave();questDraw();
}
function questStartAction(id){
 const zone=questWorld.find(z=>z.id===questState.current);
 const action=zone&&zone.actions.find(a=>a.id===id);
 if(!action||questState.done.includes(id))return;
 if((action.requires||[]).some(x=>!questState.items.includes(x)))return;
 if(action.kind==='puzzle'){
  questActivePuzzle=id;questNotice='';questShowPuzzle();return;
 }
 questCompleteAction(action);
}
function questShowPuzzle(){
 const zone=questWorld.find(z=>z.id===questState.current);
 const action=zone&&zone.actions.find(a=>a.id===questActivePuzzle);
 const box=$('questPuzzle');if(!action||!box)return;
 box.innerHTML=`<div class="quest-puzzle"><div class="quest-kicker">${en?'PUZZLE':'لغز المنطقة'}</div><h4>${action.question}</h4>
 ${action.options.map((v,i)=>`<button class="secondary quest-option" onclick="questAnswer(${i})">${v}</button>`).join('')}
 </div>`;
}
function questAnswer(i){
 const zone=questWorld.find(z=>z.id===questState.current);
 const action=zone&&zone.actions.find(a=>a.id===questActivePuzzle);
 if(!action)return;
 if(i!==action.answer){
  questNotice=en?'That is not the answer. Explore and try again.':'ليست الإجابة الصحيحة. حاول مرة أخرى!';
  questActivePuzzle='';questDraw();return;
 }
 questActivePuzzle='';
 questCompleteAction(action);
}
function rewardQuestAccount(action){
 const account=activeLocalAccount();
 if(!account||!action||!action.id)return;
 const storageKey='questAccountRewards_'+account.id;
 let rewarded=[];
 try{
  const saved=JSON.parse(get(storageKey,'[]'));
  if(Array.isArray(saved))rewarded=saved;
 }catch{}
 if(rewarded.includes(action.id))return;
 rewarded.push(action.id);
 set(storageKey,JSON.stringify(rewarded));
 const points=Math.max(0,Number(action.xp)||0);
 if(points>0||action.finish){
  addAccountPoints(points,action.finish?'quest_complete':undefined);
 }
}

function questCompleteAction(action){
 if(questState.done.includes(action.id))return;
 questState.done.push(action.id);
 if(action.item&&!questState.items.includes(action.item))questState.items.push(action.item);
 questState.xp+=action.xp||0;
 rewardQuestAccount(action);
 if(action.unlock&&!questState.unlocked.includes(action.unlock)){
  questState.unlocked.push(action.unlock);
 }
 if(action.finish)questState.finished=true;
 questNotice=action.finish?(en?'The secret is revealed!':'انكشف السر! لقد أنهيت الرحلة!'):(en?'Discovery successful!':'أحسنت! اكتشاف جديد أُضيف إلى رحلتك.');
 questSave();
 questDraw();
}
function questReset(){
 if(!confirm(en?'Restart NEXORA QUEST and erase saved progress?':'هل تريد بدء المغامرة من جديد ومسح تقدمك المحفوظ؟'))return;
 questState={current:'forest',unlocked:['forest'],done:[],items:[],xp:0,finished:false};
 questActivePuzzle='';questNotice='';questSave();questDraw();
}

function rewardQuizAccountPoints(category,questionIndex){
 const account=activeLocalAccount();
 if(!account)return;
 const storageKey='quizRewards_'+account.id;
 let rewarded=[];
 try{
  const saved=JSON.parse(get(storageKey,'[]'));
  if(Array.isArray(saved))rewarded=saved;
 }catch{}
 const token=category+':'+questionIndex;
 if(rewarded.includes(token))return;
 rewarded.push(token);
 set(storageKey,JSON.stringify(rewarded));
 addAccountPoints(10);
}

function quizAnswer(choice){
 if(quizState.answered)return;
 const cat=window.OMNIX_QUIZ[quizState.category];
 const q=cat.questions[quizState.index];
 if(!q||!Array.isArray(q.a)||q.a.length!==3||!Number.isInteger(q.c)||q.c<0||q.c>2)return;
 quizState.answered=true;
 const correct=choice===q.c;
 if(correct){
  quizState.score++;
  rewardQuizAccountPoints(quizState.category,quizState.index);
 }
 quizSave();
 q.a.forEach((_,i)=>{
  const b=$('quizOption'+i);
  if(!b)return;
  b.disabled=true;
  if(i===q.c){b.style.border='2px solid #22a06b';b.style.background='#17613c55';}
  else if(i===choice){b.style.border='2px solid #c45b5b';b.style.background='#8b303055';}
 });
 $('quizFeedback').textContent=correct
  ?(en?'Correct! ⭐ +10 points':'إجابة صحيحة! ⭐ +10 نقاط')
  :(en?'Not quite. The correct answer is: ':'إجابة غير صحيحة. الإجابة الصحيحة: ')+q.a[q.c];
 $('quizNext').style.display='block';
}

function quizNext(){
 if(!quizState.answered)return;
 quizState.index++;
 quizState.answered=false;
 quizSave();
 quizDraw();
}

function quizRestart(){

 quizStart(quizState.category);
}

function addTask(){let v=$('taskInput').value.trim();if(!v)return;let a=JSON.parse(get('tasks','[]'));a.push({text:v,done:false});set('tasks',JSON.stringify(a));$('taskList').innerHTML=taskHtml(a);$('taskInput').value=''}
function toggleTask(i,v){let a=JSON.parse(get('tasks','[]'));a[i].done=v;set('tasks',JSON.stringify(a))}
function deleteTask(i){let a=JSON.parse(get('tasks','[]'));a.splice(i,1);set('tasks',JSON.stringify(a));$('taskList').innerHTML=taskHtml(a)}

}

function phraseHtml(a){
 const from=get('langFrom','ar');
 const to=get('langTo','en');
 const rows=a.filter(p=>p[from] && p[to]);
 if(!rows.length)return `<div class="itemline">${en?'No matching translations yet':'لا توجد ترجمة لهذه العبارة حاليًا'}</div>`;
 return rows.map(p=>`
  <div class="itemline">
   <b>${escapeHtml(p[from])}</b>
   <span>${escapeHtml(p[to])}</span>
  </div>`).join('');
}

function filterPhrases(){
 const q=$('phraseSearch').value.trim().toLowerCase();
 const from=get('langFrom','ar');
 const to=get('langTo','en');
 const filtered=phrases.filter(p=>
  Object.values(p).some(v=>String(v).toLowerCase().includes(q))
 );
 $('phraseList').innerHTML=phraseHtml(filtered);
}

function calendar(){
 const today=new Date();
 const fmt=new Intl.DateTimeFormat(en?'en-US':'ar-SA',{dateStyle:'full'});
 let hijri='';
 try{
  hijri=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{dateStyle:'full'}).format(today);
 }catch(e){
  hijri=en?'Hijri calendar unavailable':'التاريخ الهجري غير متاح على هذا الجهاز';
 }
 const personal=JSON.parse(get('personalEvents','[]'));
 const fixed=[
  {name:'يوم التأسيس السعودي',month:2,day:22,type:'national'},
  {name:'اليوم الوطني السعودي',month:9,day:23,type:'national'}
 ];
 function nextGregorian(m,d){
  let x=new Date(today.getFullYear(),m-1,d);
  x.setHours(0,0,0,0);
  if(x<new Date(today.getFullYear(),today.getMonth(),today.getDate()))x.setFullYear(x.getFullYear()+1);
  return x;
 }
 function nextHijri(m,d,label){
  try{
   for(let i=0;i<=370;i++){
    let x=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
    let parts=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{month:'numeric',day:'numeric'}).formatToParts(x);
    let month=Number(parts.find(p=>p.type==='month').value);
    let day=Number(parts.find(p=>p.type==='day').value);
    if(month===m&&day===d)return {name:label,date:x,type:'islamic'};
   }
  }catch(e){}
  return null;
 }
 let events=[
  ...fixed.map(e=>({...e,date:nextGregorian(e.month,e.day)})),
  nextHijri(9,1,'بداية شهر رمضان'),
  nextHijri(10,1,'عيد الفطر'),
  nextHijri(12,9,'يوم عرفة'),
  nextHijri(12,10,'عيد الأضحى'),
  nextHijri(1,1,'رأس السنة الهجرية'),
  nextHijri(3,12,'المولد النبوي')
 ].filter(Boolean);
 personal.forEach((e,i)=>{
  let d=new Date(e.date+'T00:00:00');
  if(!isNaN(d)&&d>=new Date(today.getFullYear(),today.getMonth(),today.getDate()))
   events.push({name:e.name,date:d,type:'personal',index:i});
 });
 events.sort((a,b)=>a.date-b.date);
 const cards=events.map(e=>{
  let days=Math.ceil((new Date(e.date.getFullYear(),e.date.getMonth(),e.date.getDate())-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  let dateText=new Intl.DateTimeFormat(en?'en-US':'ar-SA',{dateStyle:'medium'}).format(e.date);
  return `<div class="itemline"><div><b>${escapeHtml(e.name)}</b><br><small>${dateText}</small><br><span class="status">${days===0?(en?'Today':'اليوم'):(en?'In ':'بعد ')+days+(en?' days':' يوم')}</span></div>${e.type==='personal'?`<button class="danger" onclick="deleteCalendarEvent(${e.index})">×</button>`:''}</div>`;
 }).join('');
 return `<div class="panel">
 <h3>${en?'Today':'تاريخ اليوم'}</h3>
 <p>${fmt.format(today)}</p><p class="status">${hijri}</p>
 </div>
 <div class="panel">
 <h3>${en?'Upcoming occasions':'المناسبات القادمة'}</h3>
 ${cards||`<p>${en?'No upcoming occasions':'لا توجد مناسبات قادمة'}</p>`}
 </div>
 <div class="panel">
 <h3>${en?'Add a personal occasion':'إضافة مناسبة شخصية'}</h3>
 <input id="eventName" placeholder="${en?'Occasion name':'اسم المناسبة'}" maxlength="60">
 <input id="eventDate" type="date">
 <button onclick="addCalendarEvent()">${en?'Add occasion':'إضافة المناسبة'}</button>
 <p class="note">${en?'Your personal occasions are saved on this device.':'مناسباتك الشخصية تُحفظ على هذا الجهاز.'}</p>
 </div>
 <div class="panel">
 <h3>${en?'Notifications':'التنبيهات'}</h3>
 <p>${en?'Receive a local reminder at 9 AM on the day before each occasion.':'استقبل تذكيرًا الساعة 9 صباحًا في اليوم السابق لكل مناسبة.'}</p>
 <button onclick="notifyCalendar()">${en?'Enable notifications':'تفعيل الإشعارات'}</button>
 <p class="note">${en?'Reminders are scheduled on this device.':'تُجدول التذكيرات على هذا الجهاز وتعمل عند إغلاق التطبيق.'}</p>
 </div>`;
}
function addCalendarEvent(){
 let name=$('eventName').value.trim(),date=$('eventDate').value;
 if(!name||!date)return showToast(en?'Enter a name and date':'اكتب اسم المناسبة وتاريخها');
 let d=new Date(date+'T00:00:00');
 if(isNaN(d)||d<new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))return showToast(en?'Choose a future date':'اختر تاريخًا اليوم أو بعده');
 let a=JSON.parse(get('personalEvents','[]'));
 a.push({name,date});
 set('personalEvents',JSON.stringify(a));
 if(get('notificationsEnabled')==='true')syncCalendarNotifications();
 $('content').innerHTML=calendar();
 showToast(en?'Occasion saved':'تم حفظ المناسبة');
}
function deleteCalendarEvent(i){
 let a=JSON.parse(get('personalEvents','[]'));
 a.splice(i,1);
 set('personalEvents',JSON.stringify(a));
 if(get('notificationsEnabled')==='true')syncCalendarNotifications();
 $('content').innerHTML=calendar();
}
async function syncCalendarNotifications(){
 if(get('notificationsEnabled')!=='true')return;
 try{
  const events=JSON.parse(get('personalEvents','[]'));
  return await window.NexoraNotifications.sync(events,en);
 }catch(error){
  console.error('NEXORA notification sync failed:',error);
 }
}

async function notifyCalendar(){
 try{
  const api=window.NexoraNotifications;

  if(!api||!api.isNative()){
   return showToast(en
    ?'Native notifications are available in the Android app'
    :'الإشعارات المجدولة متاحة داخل تطبيق Android');
  }

  const permission=await api.requestPermission();

  if(permission!=='granted'){
   return showToast(en
    ?'Notification permission was not granted'
    :'لم يتم السماح بالإشعارات');
  }

  set('notificationsEnabled','true');

  const count=await syncCalendarNotifications();

  showToast(en
   ?`Reminders enabled · ${count||0} scheduled`
   :`تم تفعيل التذكيرات · ${count||0} تذكير مجدول`);

 }catch(error){
  console.error('NEXORA notification error:',error);
  showToast(en
   ?'Could not schedule notifications. Check app permissions.'
   :'تعذرت جدولة الإشعارات. تحقق من أذونات التطبيق.');
 }
}

function accountLevelInfo(points){
 const p=Math.max(0,Number(points)||0);
 const level=Math.floor(p/100)+1;
 const progress=p%100;
 return {level,progress,remaining:100-progress,percent:progress};
}

async function deriveLocalPassword(password,salt){
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},key,256);
 return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('');
}
async function createLocalAccount(event){
 event.preventDefault();
 const name=$('newAccountName').value.trim();
 const password=$('newAccountPassword').value;
 const avatar=$('newAccountAvatar').value;
 if(name.length<2)return showToast(en?'Name is too short':'الاسم قصير جدًا');
 if(password.length<6)return showToast(en?'Password must be at least 6 characters':'كلمة المرور يجب ألا تقل عن 6 أحرف');
 if(!crypto.subtle)return showToast(en?'Secure password storage is unavailable in this app context.':'تخزين كلمة المرور بطريقة مشتقة آمنة غير متاح في بيئة التطبيق الحالية.');
 const accounts=readLocalAccounts();
 if(accounts.some(a=>a.name.toLowerCase()===name.toLowerCase()))return showToast(en?'This name is already used':'هذا الاسم مستخدم بالفعل');
 try{
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const hash=await deriveLocalPassword(password,salt);
  const id='local-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
  const saltText=btoa(String.fromCharCode(...salt));
  accounts.push({id,name,avatar,salt:saltText,hash,points:0,achievements:[],createdAt:new Date().toISOString()});
  saveLocalAccounts(accounts);
  set('activeAccount',id);
  openAccount();
  showToast(en?'Profile created':'تم إنشاء الحساب');
 }catch(error){console.error(error);showToast(en?'Could not create profile':'تعذر إنشاء الحساب');}
}
async function loginLocalAccount(event){
 event.preventDefault();
 const id=$('loginAccount').value;
 const password=$('loginAccountPassword').value;
 const account=readLocalAccounts().find(a=>a.id===id);
 if(!account)return showToast(en?'Profile not found':'الحساب غير موجود');
 try{
  const salt=Uint8Array.from(atob(account.salt),c=>c.charCodeAt(0));
  const hash=await deriveLocalPassword(password,salt);
  if(hash!==account.hash)return showToast(en?'Incorrect password':'كلمة المرور غير صحيحة');
  set('activeAccount',account.id);
  openAccount();
  showToast(en?'Welcome back':'مرحبًا بعودتك');
 }catch(error){console.error(error);showToast(en?'Could not log in':'تعذر تسجيل الدخول');}
}

function rewardQuizCompletion(category){
 const account=activeLocalAccount();
 if(!account)return;
 const allowed=['anime','series','movies'];
 if(!allowed.includes(category))return;

 const storageKey='quizCompletionRewards_'+account.id;
 let rewarded=[];
 try{
  const saved=JSON.parse(get(storageKey,'[]'));
  if(Array.isArray(saved))rewarded=saved;
 }catch{}

 if(rewarded.includes(category))return;
 rewarded.push(category);
 set(storageKey,JSON.stringify(rewarded));

 addAccountPoints(0,'quiz_complete_'+category);
}

function addAccountPoints(amount,achievement){
 const a=activeLocalAccount();
 if(!a||!Number.isFinite(Number(amount)))return;
 const accounts=readLocalAccounts();
 const item=accounts.find(x=>x.id===a.id);
 if(!item)return;
 item.points=Math.max(0,(Number(item.points)||0)+Number(amount));
 if(!Array.isArray(item.achievements))item.achievements=[];
 const earned=[];
 if(item.points>=10)earned.push('first_points');
 if(item.points>=100)earned.push('points_100');
 if(item.points>=500)earned.push('points_500');
 if(achievement)earned.push(achievement);
 earned.forEach(id=>{
  if(!item.achievements.includes(id))item.achievements.push(id);
 });
 saveLocalAccounts(accounts);
 if(current==='account')openAccount();
}

function admin(){return `<div class="panel"><h3>${en?'App settings':'إعدادات التطبيق'}</h3><p>${en?'Language and local data controls.':'اللغة والتحكم في البيانات المحلية.'}</p><button onclick="toggleLang()">${en?'Switch language':'تغيير اللغة'}</button><button class="secondary" onclick="backupData()">${en?'Export backup':'تصدير نسخة احتياطية'}</button><div style="margin-top:12px"><label>${en?'Restore backup file':'استعادة نسخة احتياطية'}</label><input type="file" id="backupFile" accept="application/json,.json"><button onclick="restoreData()">${en?'Restore':'استعادة'}</button></div></div><div class="panel"><h3>${en?'About NEXORA':'حول NEXORA'}</h3><p>NEXORA · منصة للتعلم والترفيه</p><small>${en?'Version 2.1 · Data stored locally on this device.':'الإصدار 2.1 · البيانات محفوظة محليًا على هذا الجهاز.'}</small></div><div class="note">${en?'Admin panel controls this app on this device; it is not a remote server dashboard.':'لوحة الإدارة تتحكم في التطبيق على هذا الجهاز، وليست لوحة تحكم بخادم خارجي.'}</div>`}
function backupData(){let data={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k.startsWith('om_'))data[k]=localStorage.getItem(k)}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='omnix-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(){let f=$('backupFile').files[0];if(!f)return showToast(en?'Choose a backup':'اختر نسخة احتياطية');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);Object.keys(d).forEach(k=>{if(k.startsWith('om_'))localStorage.setItem(k,d[k])});showToast(en?'Backup restored':'تمت استعادة النسخة');setTimeout(()=>location.reload(),700)}catch{showToast(en?'Invalid backup file':'ملف النسخة غير صالح')}};r.readAsText(f)}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>showToast(en?'Copied':'تم النسخ')).catch(()=>showToast(en?'Copy unavailable':'تعذر النسخ'));else showToast(en?'Copy unavailable':'النسخ غير متاح')}
function showToast(t){alert(t)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('content').addEventListener('change',e=>{if(e.target.id==='qAudio'&&e.target.files[0]){$('audioPlayer').src=URL.createObjectURL(e.target.files[0]);$('audioPlayer').classList.remove('hidden')}});
let secretTapCount=0,secretTapTimer=null;
$('secretMark').addEventListener('click',()=>{secretTapCount++;clearTimeout(secretTapTimer);secretTapTimer=setTimeout(()=>secretTapCount=0,1800);if(secretTapCount>=5){secretTapCount=0;openAdminSecret()}});
function openAdminSecret(){let pin=prompt(en?'Set or enter your local admin PIN:':'أنشئ أو أدخل رمز لوحة الإدارة المحلية:');if(pin===null||!pin.trim())return;let saved=get('adminPin');if(!saved){if(pin.trim().length<4)return alert(en?'PIN must be at least 4 characters':'يجب أن يكون الرمز 4 خانات على الأقل');set('adminPin',pin.trim());alert(en?'Local admin PIN saved':'تم حفظ رمز الإدارة على هذا الجهاز');}else if(pin.trim()!==saved){alert(en?'Incorrect PIN':'الرمز غير صحيح');return;}current='admin';$('home').classList.add('hidden');$('section').classList.remove('hidden');$('sectionTitle').textContent=en?'Hidden Admin':'لوحة الإدارة المخفية';$('content').innerHTML=admin();}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
renderHome();
initNexoraScreenTime();
</script>
