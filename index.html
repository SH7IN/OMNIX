*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#111a30 0,#070912 42%);color:var(--white);font-family:Arial,sans-serif;min-height:100vh}
header{padding:22px 16px 14px;text-align:center;border-bottom:1px solid #263b60}
.mark{width:54px;height:54px;margin:0 auto 9px;border:2px solid var(--copper);border-radius:16px;display:grid;place-items:center;color:var(--soft);font-size:25px;font-weight:900;transform:rotate(45deg)}
.mark span{transform:rotate(-45deg)}.logo{font-size:30px;font-weight:900;letter-spacing:6px;color:var(--copper)}.sub{font-size:10px;letter-spacing:4px;color:var(--muted);margin-top:5px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}.top strong{font-size:14px}
main{padding:0 14px 28px;max-width:850px;margin:auto}h2{font-size:19px;color:var(--copper);margin:10px 0 14px}h3{font-size:16px;color:var(--soft);margin:4px 0 10px}
.panel,.tile{background:linear-gradient(145deg,#111a30,#121315);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px}
.panel p,.muted{color:var(--muted);font-size:13px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:105px;text-align:center;cursor:pointer;color:var(--white);font-size:14px;font-weight:bold}.tile:active,button:active{transform:scale(.98)}.tile .ico{display:block;color:var(--copper);font-size:25px;margin-bottom:10px}
button,.btn{background:#151d35;border:1px solid #426b9c;color:var(--soft);border-radius:11px;padding:11px 14px;font-weight:bold;cursor:pointer;font-size:13px}
button.secondary{background:#111214;border-color:#34496d;color:var(--white)}button.danger{border-color:#8c4545;color:#ffb5a9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
input,textarea,select{width:100%;padding:12px;background:#0d0e10;border:1px solid #34496d;border-radius:10px;color:var(--white);margin:5px 0 10px;font:inherit}
input[type=checkbox]{width:auto;vertical-align:middle;margin-inline-end:7px}textarea{min-height:90px;resize:vertical}label{font-size:13px;color:var(--muted)}.hidden{display:none!important}
.back{margin:4px 0 15px}.itemline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #30271e}.itemline:last-child{border:0}
@font-face{

 src:url("./fonts/amiri-quran.woff2") format("woff2");

}
.ayahs{font-family:"Amiri Quran",serif;font-size:22px;line-height:2.2;text-align:center;color:var(--soft)}.status{color:var(--copper);font-size:13px;margin-top:10px}
.big{font-size:25px;color:var(--copper);font-weight:bold}.answer{display:block;width:100%;text-align:right;margin:7px 0}
footer{text-align:center;color:#75634e;padding:18px;font-size:11px}
.tile{position:relative;overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s}
.tile:hover{transform:translateY(-3px);border-color:#e2a65a;box-shadow:0 8px 28px #d8792822}

.chat-log{height: min(48vh,420px);overflow:auto;background:#0b0c0e;border:1px solid #263b60;border-radius:13px;padding:12px;margin:12px 0}

small{color:var(--muted)}.note{background:#101113;padding:12px;border-radius:10px;color:var(--muted);font-size:12px;line-height:1.7}

.hud-core{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:48px;color:#b8f7ff;background:radial-gradient(circle,#1a5672,#10273c 55%,#08111e 76%);border:1px solid #75efff9c;box-shadow:0 0 25px #20dfff66,inset 0 0 20px #4ceaff38;text-shadow:0 0 15px #7bf4ff}

.node-one{top:18px;right:35px}.node-two{bottom:24px;left:27px;background:#c7a1ff;box-shadow:0 0 12px 3px #a16cff99}

.hud-kicker{font-size:9px;letter-spacing:2.5px;color:#67dff4}

.hud-readout small{font-size:8px;letter-spacing:1px;color:#7398b3}
.hud-wave{font-size:19px;letter-spacing:3px;color:#69eaff;text-shadow:0 0 12px #3bdcff;animation:waveGlow 1.2s ease-in-out infinite alternate}

.marble-frame{

function renderXOGame(){

 </div>

function xoSetMode(mode){xoMode=mode;xoRestart();}
function xoWinner(b){
 for(const [a,c,d] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])
  if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];
 return b.every(Boolean)?'D':'';
}
function xoDraw(){
 const board=$('xoBoard');if(!board)return;
 board.innerHTML=xoBoard.map((v,i)=>`<button class="tile" style="min-height:88px;font-size:34px;color:${v==='X'?'#e5ad69':'#eee'}" onclick="xoPlay(${i})" ${v||xoDone?'disabled':''}>${v||'·'}</button>`).join('');
 const w=xoWinner(xoBoard);
 $('xoStatus').textContent=xoDone?(w==='D'?(en?'Draw!':'تعادل!'):(en?'Winner: ':'الفائز: ')+w):(en?'Turn: ':'الدور: ')+xoTurn;
 $('xoScore').textContent=(en?'X: ':'إكس: ')+xoScores.X+'   '+(en?'O: ':'أو: ')+xoScores.O+'   '+(en?'Draws: ':'تعادلات: ')+xoScores.D;
}
function xoFinish(){
 const w=xoWinner(xoBoard);if(!w)return false;
 xoDone=true;xoScores[w]++;xoDraw();return true;
}
function xoPlay(i){
 if(xoDone||xoBoard[i])return;
 if(xoMode==='cpu'&&xoTurn==='O')return;
 xoBoard[i]=xoTurn;
 if(xoFinish())return;
 xoTurn=xoTurn==='X'?'O':'X';
 if(xoMode==='cpu'&&xoTurn==='O'){
  const move=xoBestMove();if(move>=0)xoBoard[move]='O';
  if(!xoFinish())xoTurn='X';
 }
 xoDraw();
}
function xoBestMove(){
 let best=-Infinity,choice=-1;
 for(let i=0;i<9;i++)if(!xoBoard[i]){
  xoBoard[i]='O';const score=xoMinimax(false);xoBoard[i]='';
  if(score>best){best=score;choice=i;}
 }
 return choice;
}
function xoMinimax(maximize){
 const w=xoWinner(xoBoard);
 if(w==='O')return 10;if(w==='X')return -10;if(w==='D')return 0;
 let best=maximize?-Infinity:Infinity;
 for(let i=0;i<9;i++)if(!xoBoard[i]){
  xoBoard[i]=maximize?'O':'X';
  const score=xoMinimax(!maximize);xoBoard[i]='';
  best=maximize?Math.max(best,score):Math.min(best,score);
 }
 return best;
}
function xoRestart(){xoBoard=Array(9).fill('');xoTurn='X';xoDone=false;xoDraw();}

let chessGame=null,chessSelected=null,chessPromotion=null;
const chessGlyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};
function renderChessGame(){
 const a=$('miniGameArea');if(!a)return;
 if(!window.ChessEngine||!window.ChessEngine.Chess){a.innerHTML='<div class="panel">محرك الشطرنج غير محمّل. أعد تحميل التطبيق.</div>';return;}
 chessGame=new window.ChessEngine.Chess();chessSelected=null;chessPromotion=null;
 a.innerHTML=`<div class="panel">
 <button class="secondary" onclick="closeMiniGame()">← ${en?'Games':'الألعاب'}</button>
 <h3>${en?'NEXORA Chess':'شطرنج NEXORA'}</h3>

 <div class="marble-frame"><div id="chessBoard" class="marble-board"></div></div>
 <div id="chessPromotion" class="row"></div>
 <div class="row">
 <button onclick="chessUndo()" class="secondary">${en?'Undo':'تراجع'}</button>
 <button onclick="chessRestart()">${en?'Restart':'إعادة اللعب'}</button>
 </div>
 <div id="chessMoves" class="status"></div>
 </div>`;
 chessDraw();
}
function chessDraw(){
 if(!chessGame||!$('chessBoard'))return;
 const board=chessGame.board(),files='abcdefgh';
 let html='';
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const sq=files[c]+(8-r),piece=board[r][c],selected=chessSelected===sq;
  const targets=chessSelected?chessGame.moves({square:chessSelected,verbose:true}).filter(m=>m.to===sq):[];
  const light=(r+c)%2===1;
  const squareClass=selected?'selected':targets.length?'target':light?'marble-light':'marble-dark';
  const glyph=piece?chessGlyph[piece.color+piece.type]:'';
  html+=`<button class="marble-square ${squareClass}" onclick="chessTap('${sq}')" aria-label="${sq}" style="color:${piece&&piece.color==='w'?'#fffaf0':'#17130f'}">${glyph}<span class="marble-coordinate">${c===0?8-r:''}${r===7?files[c]:''}</span></button>`;
 }
 $('chessBoard').innerHTML=html;
 const status=chessGame.isCheckmate()?(en?'Checkmate! ':'كش مات! ')+(chessGame.turn()==='w'?(en?'Black wins':'الأسود فاز'):(en?'White wins':'الأبيض فاز')):chessGame.isStalemate()?(en?'Draw by stalemate':'تعادل بالخنق'):chessGame.isDraw()?(en?'Draw':'تعادل'):((chessGame.turn()==='w'?(en?'White':'الأبيض'):(en?'Black':'الأسود'))+(en?' to move':' عليه اللعب')+(chessGame.isCheck()?' · '+(en?'Check':'كش'):''));
 $('chessStatus').textContent=status;
 $('chessMoves').textContent=(en?'Moves: ':'النقلات: ')+chessGame.history().join(' ');
}
function chessTap(sq){
 if(!chessGame||chessGame.isGameOver()||chessPromotion)return;
 const piece=chessGame.get(sq);
 if(chessSelected){
  const options=chessGame.moves({square:chessSelected,verbose:true}).filter(m=>m.to===sq);
  if(options.length){
   if(options.some(m=>m.promotion)){chessPromotion={from:chessSelected,to:sq};chessShowPromotion();return;}
   chessGame.move({from:chessSelected,to:sq});chessSelected=null;chessDraw();return;
  }
 }
 if(piece&&piece.color===chessGame.turn()){chessSelected=sq;chessDraw();}
 else{chessSelected=null;chessDraw();}
}
function chessShowPromotion(){
 const el=$('chessPromotion');if(!el)return;
 const color=chessGame.turn(),pieces=['q','r','b','n'];
 el.innerHTML=pieces.map(p=>`<button onclick="chessPromote('${p}')">${chessGlyph[color+p]} ${({q:'Queen',r:'Rook',b:'Bishop',n:'Knight'})[p]}</button>`).join('');
}
function chessPromote(piece){
 if(!chessPromotion)return;
 chessGame.move({...chessPromotion,promotion:piece});
 chessPromotion=null;chessSelected=null;
 $('chessPromotion').innerHTML='';chessDraw();
}
function chessUndo(){if(!chessGame)return;chessGame.undo();chessPromotion=null;chessSelected=null;if($('chessPromotion'))$('chessPromotion').innerHTML='';chessDraw();}
function chessRestart(){chessGame=new window.ChessEngine.Chess();chessSelected=null;chessPromotion=null;if($('chessPromotion'))$('chessPromotion').innerHTML='';chessDraw();}

function quizLoad(cat){
 try{
  const v=JSON.parse(get('quiz_'+cat,'{}'));
  return {index:Math.max(0,Math.min(Number(v.index)||0,window.OMNIX_QUIZ[cat].questions.length)),score:Math.max(0,Number(v.score)||0)};
 }catch{return {index:0,score:0};}
}

function quizSave(){
 set('quiz_'+quizState.category,JSON.stringify({
  index:quizState.index,score:quizState.score
 }));
}

function quizStart(cat){
 if(!window.OMNIX_QUIZ[cat])return;
 const saved=quizLoad(cat);
 quizState={category:cat,index:saved.index,score:saved.score,answered:false};
 quizDraw();
}

function quizDraw(){
 const area=$('miniGameArea');
 if(!area)return;
 const cat=window.OMNIX_QUIZ[quizState.category];
 if(!cat)return quizCategoryScreen();
 const total=cat.questions.length;
 if(quizState.index>=total){

  return;
 }
 const q=cat.questions[quizState.index];

 area.innerHTML=`<div class="panel">
  <div class="row" style="justify-content:space-between;align-items:center">
   <button class="secondary" onclick="quizCategoryScreen()">← ${en?'Categories':'الأقسام'}</button>

   <div style="height:100%;width:${progress}%;background:linear-gradient(90deg,#a66a36,#e8bd78);transition:width .3s"></div>
  </div>
  <p class="status" style="text-align:center">${en?'Question':'السؤال'} ${quizState.index+1} / ${total}</p>

   <strong style="font-size:18px;line-height:1.8">${escapeHtml(q.q)}</strong>
  </div>
  <div class="col" style="gap:10px">
   ${q.a.map((answer,i)=>`<button id="quizOption${i}" class="secondary" onclick="quizAnswer(${i})" style="text-align:${en?'left':'right'};white-space:normal;line-height:1.6">${i+1}. ${escapeHtml(answer)}</button>`).join('')}
  </div>
  <div id="quizFeedback" class="status" style="text-align:center;margin-top:14px"></div>
  <button id="quizNext" style="display:none;width:100%;margin-top:10px" onclick="quizNext()">${en?'Next question':'السؤال التالي'} ←</button>
 </div>`;
}

function quizAnswer(choice){
 if(quizState.answered)return;
 const cat=window.OMNIX_QUIZ[quizState.category];
 const q=cat.questions[quizState.index];
 if(!q||!Array.isArray(q.a)||q.a.length!==3||!Number.isInteger(q.c)||q.c<0||q.c>2)return;
 quizState.answered=true;
 const correct=choice===q.c;
 if(correct)quizState.score++;
 quizSave();
 q.a.forEach((_,i)=>{
  const b=$('quizOption'+i);
  if(!b)return;
  b.disabled=true;
  if(i===q.c){b.style.border='2px solid #22a06b';b.style.background='#17613c55';}
  else if(i===choice){b.style.border='2px solid #c45b5b';b.style.background='#8b303055';}
 });
 $('quizFeedback').textContent=correct
  ?(en?'Correct! ⭐ +10 points':'إجابة صحيحة! ⭐ +10 نقاط')
  :(en?'Not quite. The correct answer is: ':'إجابة غير صحيحة. الإجابة الصحيحة: ')+q.a[q.c];
 $('quizNext').style.display='block';
}

function quizNext(){
 if(!quizState.answered)return;
 quizState.index++;
 quizState.answered=false;
 quizSave();
 quizDraw();
}

function quizRestart(){
 if(!quizState.category)return;
 set('quiz_'+quizState.category,JSON.stringify({index:0,score:0}));
 quizStart(quizState.category);
}

function calendar(){
 const today=new Date();
 const fmt=new Intl.DateTimeFormat(en?'en-US':'ar-SA',{dateStyle:'full'});
 let hijri='';
 try{
  hijri=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{dateStyle:'full'}).format(today);
 }catch(e){
  hijri=en?'Hijri calendar unavailable':'التاريخ الهجري غير متاح على هذا الجهاز';
 }
 const personal=JSON.parse(get('personalEvents','[]'));
 const fixed=[
  {name:'يوم التأسيس السعودي',month:2,day:22,type:'national'},
  {name:'اليوم الوطني السعودي',month:9,day:23,type:'national'}
 ];
 function nextGregorian(m,d){
  let x=new Date(today.getFullYear(),m-1,d);
  x.setHours(0,0,0,0);
  if(x<new Date(today.getFullYear(),today.getMonth(),today.getDate()))x.setFullYear(x.getFullYear()+1);
  return x;
 }
 function nextHijri(m,d,label){
  try{
   for(let i=0;i<=370;i++){
    let x=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);
    let parts=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{month:'numeric',day:'numeric'}).formatToParts(x);
    let month=Number(parts.find(p=>p.type==='month').value);
    let day=Number(parts.find(p=>p.type==='day').value);
    if(month===m&&day===d)return {name:label,date:x,type:'islamic'};
   }
  }catch(e){}
  return null;
 }
 let events=[
  ...fixed.map(e=>({...e,date:nextGregorian(e.month,e.day)})),
  nextHijri(9,1,'بداية شهر رمضان'),
  nextHijri(10,1,'عيد الفطر'),
  nextHijri(12,9,'يوم عرفة'),
  nextHijri(12,10,'عيد الأضحى'),
  nextHijri(1,1,'رأس السنة الهجرية'),
  nextHijri(3,12,'المولد النبوي')
 ].filter(Boolean);
 personal.forEach((e,i)=>{
  let d=new Date(e.date+'T00:00:00');
  if(!isNaN(d)&&d>=new Date(today.getFullYear(),today.getMonth(),today.getDate()))
   events.push({name:e.name,date:d,type:'personal',index:i});
 });
 events.sort((a,b)=>a.date-b.date);
 const cards=events.map(e=>{
  let days=Math.ceil((new Date(e.date.getFullYear(),e.date.getMonth(),e.date.getDate())-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  let dateText=new Intl.DateTimeFormat(en?'en-US':'ar-SA',{dateStyle:'medium'}).format(e.date);
  return `<div class="itemline"><div><b>${escapeHtml(e.name)}</b><br><small>${dateText}</small><br><span class="status">${days===0?(en?'Today':'اليوم'):(en?'In ':'بعد ')+days+(en?' days':' يوم')}</span></div>${e.type==='personal'?`<button class="danger" onclick="deleteCalendarEvent(${e.index})">×</button>`:''}</div>`;
 }).join('');
 return `<div class="panel">
 <h3>${en?'Today':'تاريخ اليوم'}</h3>
 <p>${fmt.format(today)}</p><p class="status">${hijri}</p>
 </div>
 <div class="panel">
 <h3>${en?'Upcoming occasions':'المناسبات القادمة'}</h3>
 ${cards||`<p>${en?'No upcoming occasions':'لا توجد مناسبات قادمة'}</p>`}
 </div>
 <div class="panel">
 <h3>${en?'Add a personal occasion':'إضافة مناسبة شخصية'}</h3>
 <input id="eventName" placeholder="${en?'Occasion name':'اسم المناسبة'}" maxlength="60">
 <input id="eventDate" type="date">
 <button onclick="addCalendarEvent()">${en?'Add occasion':'إضافة المناسبة'}</button>
 <p class="note">${en?'Your personal occasions are saved on this device.':'مناسباتك الشخصية تُحفظ على هذا الجهاز.'}</p>
 </div>
 <div class="panel">
 <h3>${en?'Notifications':'التنبيهات'}</h3>
 <p>${en?'Allow notifications to receive a reminder when you open the calendar.':'اسمح بالإشعارات لتلقي تذكير عند فتح التقويم.'}</p>
 <button onclick="notifyCalendar()">${en?'Enable notifications':'تفعيل الإشعارات'}</button>
 <p class="note">${en?'Notifications are not scheduled while the app is closed yet.':'لا يتم جدولة الإشعارات حتى الآن عندما يكون التطبيق مغلقًا.'}</p>
 </div>`;
}
function addCalendarEvent(){
 let name=$('eventName').value.trim(),date=$('eventDate').value;

 let a=JSON.parse(get('personalEvents','[]'));
 a.push({name,date});
 set('personalEvents',JSON.stringify(a));
 $('content').innerHTML=calendar();
 showToast(en?'Occasion saved':'تم حفظ المناسبة');
}
function deleteCalendarEvent(i){
 let a=JSON.parse(get('personalEvents','[]'));
 a.splice(i,1);
 set('personalEvents',JSON.stringify(a));

}
async function notifyCalendar(){
 if(!('Notification' in window))return showToast(en?'Notifications are not supported':'الإشعارات غير مدعومة على هذا الجهاز');
 let permission=Notification.permission;
 if(permission==='default')permission=await Notification.requestPermission();
 if(permission!=='granted')return showToast(en?'Notification permission not granted':'لم يتم السماح بالإشعارات');
 let a=JSON.parse(get('personalEvents','[]'));
 let today=new Date();today.setHours(0,0,0,0);
 let soon=a.filter(e=>{
  let d=new Date(e.date+'T00:00:00');
  let days=Math.ceil((d-today)/86400000);
  return days>=0&&days<=1;
 });
 if(!soon.length)return showToast(en?'Notifications enabled':'تم تفعيل الإشعارات');
 soon.forEach(e=>new Notification('NEXORA · '+e.name,{body:en?'An occasion is coming up':'اقترب موعد مناسبتك'}));
 showToast(en?'Notifications enabled':'تم تفعيل الإشعارات');
}

function openAdminSecret(){let pin=prompt(en?'Set or enter your local admin PIN:':'أنشئ أو أدخل رمز لوحة الإدارة المحلية:');if(pin===null||!pin.trim())return;let saved=get('adminPin');if(!saved){if(pin.trim().length<4)return alert(en?'PIN must be at least 4 characters':'يجب أن يكون الرمز 4 خانات على الأقل');set('adminPin',pin.trim());alert(en?'Local admin PIN saved':'تم حفظ رمز الإدارة على هذا الجهاز');}else if(pin.trim()!==saved){alert(en?'Incorrect PIN':'الرمز غير صحيح');return;}current='admin';$('home').classList.add('hidden');$('section').classList.remove('hidden');$('sectionTitle').textContent=en?'Hidden Admin':'لوحة الإدارة المخفية';$('content').innerHTML=admin();}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
renderHome();
